name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: Mostrar o diálogo SSH (diagnóstico)
        type: boolean
        default: false

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secrets necessários (Settings → Secrets and variables → Actions):
      #   DEPLOY_SSH_KEY  conteúdo da chave privada de deploy
      #   DEPLOY_HOST     usuario@host do SFTP
      - name: Configurar chave SFTP
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          # tr remove \r caso a chave tenha sido colada com quebras de linha do Windows
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::DEPLOY_SSH_KEY inválida: cole o arquivo da chave inteiro, do BEGIN ao END"; exit 1; }
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts
          echo "DEPLOY_KEY=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"

      - name: Publicar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DEBUG: ${{ inputs.debug && '1' || '' }}
        run: ./deploy.sh
